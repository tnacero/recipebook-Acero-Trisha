{% extends 'base.html' %}

{% load static %}

{% block title %} Recipes List {% endblock %}

{% block header %} Recipes List {% endblock %}

{% block content %}
    <ul>
        {% for recipe in object_list %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">{{ recipe }}</a>
        {% endfor %}
    </ul>

    <a href="{% url 'ledger:recipe-create' %}">Create New Recipe</a>
{% endblock %}
