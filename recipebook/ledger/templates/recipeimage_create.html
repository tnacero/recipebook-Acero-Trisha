{% extends 'base.html' %}

{% load static %}

{% block title %} Recipe Image Form {% endblock %}

{% block header %} Recipe Image Form {% endblock %}

{% block content %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Submit</button>
    </form>

    <a href="{% url 'ledger:recipe-detail' pk=recipe.pk %}">Back to Recipe</a>
{% endblock %}
